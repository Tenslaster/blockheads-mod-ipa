name: Build Sideloadly IPA

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download original IPA (release "base")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p base
          gh release download base --repo "${{ github.repository }}" --pattern "*.ipa" --dir base
          ls -lh base

      - name: Patch and pack unsigned IPA
        run: |
          python3 scripts/patch_ipa.py \
            --ipa base/*.ipa \
            --portal portalChest \
            --out Blockheads_1.7_mod.ipa \
            --app work/Payload/Blockheads.app
          python3 - <<'PY'
          import struct, zipfile
          z = zipfile.ZipFile("Blockheads_1.7_mod.ipa")
          b = z.read("Payload/Blockheads.app/Blockheads")
          ncmds = struct.unpack_from("<I", b, 16)[0]
          off = 32
          segs = []
          for _ in range(ncmds):
              cmd, sz = struct.unpack_from("<II", b, off)
              if cmd == 0x19:
                  segs.append(b[off+8:off+24].split(b"\x00", 1)[0].decode())
              off += sz
          assert segs == ["__PAGEZERO", "__TEXT", "__DATA", "__LINKEDIT"], segs
          assert ncmds == 44, ncmds
          print("ok ncmds", ncmds, "segs", segs, "size", len(b))
          PY

      - name: Publish IPA release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete sideloadly --yes --cleanup-tag || true
          gh release create sideloadly Blockheads_1.7_mod.ipa \
            --title "Sideloadly IPA" \
            --notes "Unsigned. Open in Sideloadly and sign with your Apple ID."
